<style>
  :root { --purple:#1C0B33; --purple2:#2A1452; --gold:#D4AF37; --gold-soft:#E9CE7A; --ink:#F5F0E6; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Georgia,'Times New Roman',serif; background:var(--purple); color:var(--ink); display:flex; height:100vh; }
  #sidebar { width:340px; min-width:340px; background:linear-gradient(180deg,var(--purple),var(--purple2)); padding:18px; overflow-y:auto; border-right:2px solid var(--gold); }
  #map { flex:1; }
  h1 { font-size:20px; color:var(--gold); margin:0 0 4px; letter-spacing:0.5px; }
  .sub { font-size:12px; opacity:0.75; margin-bottom:14px; }
  .legend { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; font-size:11px; }
  .legend span { display:flex; align-items:center; gap:5px; }
  .dot { width:10px; height:10px; border-radius:50%; display:inline-block; }
  .zip-item { background:rgba(212,175,55,0.08); border:1px solid rgba(212,175,55,0.25); border-radius:10px; padding:10px 12px; margin-bottom:8px; cursor:pointer; }
  .zip-item:hover { background:rgba(212,175,55,0.18); }
  .zip-item.spotlight { border:2px solid var(--gold); background:rgba(212,175,55,0.16); }
  .zip-head { display:flex; justify-content:space-between; font-size:14px; color:var(--gold-soft); font-weight:bold; }
  .biz-list { margin-top:8px; display:none; }
  .zip-item.open .biz-list { display:block; }
  .biz { font-size:12px; padding:5px 6px; border-radius:6px; cursor:pointer; display:block; color:var(--ink); text-decoration:none; }
  .biz:hover { background:rgba(255,255,255,0.1); }
  .biz small { opacity:0.7; }
  .section-label { font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--gold); margin:14px 0 8px; opacity:0.8; }
  .unmatched { font-size:12px; opacity:0.8; }
  .unmatched div { padding:3px 0; }
  .leaflet-popup-content-wrapper { background:var(--purple2); color:var(--ink); border:1px solid var(--gold); }
  .leaflet-popup-tip { background:var(--purple2); border:1px solid var(--gold); }
  .popup-name { font-weight:bold; color:var(--gold); font-size:14px; margin-bottom:3px; }
  .popup-line { font-size:12px; }
  .badge { display:inline-block; padding:1px 7px; border-radius:8px; font-size:10px; color:#000; font-weight:bold; }
  .view-all { width:100%; padding:8px; background:transparent; border:1px solid var(--gold); color:var(--gold); border-radius:8px; cursor:pointer; font-family:inherit; margin-bottom:12px; }
  .view-all:hover { background:rgba(212,175,55,0.15); }
</style>
