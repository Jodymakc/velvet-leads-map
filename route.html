<html lang="en">

<meta charset="utf-8">

<title>Velvet Solutions — Door Route</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --purple:#1C0B33; --purple2:#2A1452; --gold:#D4AF37; --gold-soft:#E9CE7A; --ink:#F5F0E6; --muted:#BCAECF; --green:#3FBF7F; --red:#E4695B; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; }
  body { font-family:Georgia,'Times New Roman',serif; background:var(--purple); color:var(--ink); display:flex; height:100dvh; overflow:hidden; }
  #sheet { width:392px; min-width:392px; height:100dvh; overflow-y:auto; background:linear-gradient(180deg,var(--purple),var(--purple2)); border-right:2px solid var(--gold); padding:20px 16px 28px; }
  #map { flex:1; height:100dvh; background:#241145; }
  .brand { display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
  .brand span { font-size:11px; letter-spacing:1.6px; text-transform:uppercase; color:var(--gold); }
  .brand a { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; font-size:12px; color:var(--gold-soft); text-decoration:none; border-bottom:1px solid rgba(212,175,55,.45); padding-bottom:1px; }
  h1 { font-size:25px; margin:10px 0 4px; color:var(--gold); letter-spacing:.4px; }
  .sub { font-size:12.5px; color:var(--muted); margin:0 0 14px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
  .summary { font-size:13px; line-height:1.5; color:var(--ink); margin:0 0 16px; padding:12px 13px; border-left:2px solid var(--gold); background:rgba(212,175,55,.07); border-radius:0 8px 8px 0; }
  .start { display:flex; align-items:center; gap:10px; padding:11px 12px; border:1px solid rgba(63,191,127,.55); border-radius:10px; background:rgba(63,191,127,.09); margin-bottom:16px; }
  .start .you { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; font-size:10px; font-weight:700; letter-spacing:1px; color:#0B2A1B; background:var(--green); padding:4px 7px; border-radius:5px; }
  .start strong { display:block; font-size:13.5px; }
  .start small { display:block; font-size:11.5px; color:var(--muted); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; margin-top:2px; }
  ol.stops { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px; }
  li.stop { border:1px solid rgba(212,175,55,.22); border-radius:12px; background:rgba(255,255,255,.035); padding:12px 13px 11px; cursor:pointer; transition:border-color .15s, background .15s; }
  li.stop:hover, li.stop.active { border-color:var(--gold); background:rgba(212,175,55,.1); }
  .head { display:flex; gap:10px; align-items:flex-start; }
  .num { flex:0 0 auto; width:26px; height:26px; border-radius:50%; background:var(--gold); color:#22103F; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; font-weight:700; font-size:13px; display:flex; align-items:center; justify-content:center; }
  .head h2 { font-size:15px; margin:1px 0 2px; line-height:1.25; }
  .cat { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; font-size:11px; color:var(--muted); }
  .addr { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; font-size:12.5px; line-height:1.45; margin:9px 0 0; color:#E8E0F2; }
  .tags { display:flex; flex-wrap:wrap; gap:6px; margin-top:9px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
  .tag { font-size:10.5px; padding:3px 7px; border-radius:5px; border:1px solid rgba(245,240,230,.28); color:#E8E0F2; }
  .tag.star { border-color:rgba(212,175,55,.65); color:var(--gold-soft); }
  .tag.closed { border-color:rgba(228,105,91,.8); color:#F2A79D; }
  .tag.hook { border-color:rgba(212,175,55,.45); color:var(--gold-soft); background:rgba(212,175,55,.09); }
  .today { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; font-size:12.5px; margin-top:9px; display:flex; gap:8px; align-items:baseline; }
  .today b { font-weight:600; color:var(--gold-soft); font-size:11px; letter-spacing:.6px; text-transform:uppercase; }
  details { margin-top:8px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
  summary { font-size:11.5px; color:var(--muted); cursor:pointer; list-style:none; }
  summary::-webkit-details-marker { display:none; }
  summary::after { content:' ›'; }
  details[open] summary::after { content:' ⌄'; }
  table { width:100%; border-collapse:collapse; margin-top:6px; font-size:11.5px; }
  td { padding:3px 0; color:#DDD3EA; }
  td:last-child { text-align:right; }
  tr.now td { color:var(--gold-soft); font-weight:600; }
  .acts { display:flex; gap:8px; margin-top:10px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
  .acts a { flex:1; text-align:center; font-size:12px; text-decoration:none; padding:8px 6px; border-radius:7px; border:1px solid rgba(212,175,55,.5); color:var(--gold-soft); }
  .acts a.primary { background:var(--gold); color:#22103F; border-color:var(--gold); font-weight:600; }
  .foot { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; font-size:11px; line-height:1.55; color:var(--muted); margin:18px 0 0; }
  .pin-num { width:26px; height:26px; border-radius:50%; background:var(--gold); color:#22103F; border:2px solid #22103F; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; font-weight:700; font-size:12.5px; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 7px rgba(0,0,0,.5); }
  .pin-num.closed { background:#8B7AA0; color:#F5F0E6; }
  .pin-you { background:var(--green); color:#08301D; border:2px solid #08301D; font-size:9.5px; font-weight:700; letter-spacing:.5px; width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 8px rgba(0,0,0,.55); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
  .leaflet-popup-content-wrapper { background:#241145; color:var(--ink); border:1px solid var(--gold); border-radius:9px; }
  .leaflet-popup-tip { background:#241145; }
  .leaflet-popup-content { margin:11px 13px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; font-size:12.5px; line-height:1.5; }
  .leaflet-popup-content b { color:var(--gold-soft); font-family:Georgia,serif; font-size:13.5px; }
  .legend { position:absolute; left:12px; bottom:14px; z-index:500; background:rgba(28,11,51,.92); border:1px solid rgba(212,175,55,.4); border-radius:9px; padding:9px 11px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; font-size:11px; line-height:1.7; }
  .legend i { display:inline-block; width:22px; height:0; border-top:2px dashed var(--gold); vertical-align:middle; margin-right:7px; }
  .legend i.drive { border-top-color:#F5F0E6; }
  @media (max-width:820px) {
    body { flex-direction:column; overflow:auto; height:auto; }
    #map { order:0; height:44dvh; width:100%; }
    #sheet { order:1; width:100%; min-width:0; height:auto; border-right:0; border-top:2px solid var(--gold); overflow:visible; }
    .legend { font-size:10px; left:8px; bottom:8px; padding:7px 9px; }
    h1 { font-size:22px; }
  }
</style>

function popupHtml(d) {
  var h = "<b>" + d.n + ". " + d.name + "</b><br>" + d.address + "<br>";
  if (d.rating) h += "\u2605 " + d.rating + " (" + d.reviews + " reviews)<br>";
  h += "Today: " + d.hours[todayName];
  return h;

});

  var rows = "";

    "<div class=\"today\"><b>Today</b><span>" + todayHours + "</span></div>" +
    "<details><summary>All hours</summary><table>" + rows + "</table></details>" +
    "<div class=\"acts\"><a class=\"primary\" href=\"tel:+1" + d.phone.replace(/[^0-9]/g,"") + "\">Call</a><a href=\"" + dir + "\" target=\"_blank\" rel=\"noopener\">Directions</a></div>";
  li.addEventListener("click", function(ev){
    if (ev.target.tagName === "A" || ev.target.tagName === "SUMMARY") return;
    document.querySelectorAll("li.stop").forEach(function(x){ x.classList.remove("active"); });
    li.classList.add("active");
    map.setView([d.lat, d.lon], 17, { animate:true });
    markers[d.n].openPopup();
    if (window.innerWidth <= 820) window.scrollTo({ top:0, behavior:"smooth" });
  });
  list.appendChild(li);
});
</script>
</body>
</html>
